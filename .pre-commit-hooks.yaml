# Hooks this repository publishes. Consume them from another repo with:
#
#   - repo: https://github.com/therealm-tech/skillmgr
#     rev: v0.1.0
#     hooks:
#       - id: skillmgr-validate
- id: skillmgr-validate
  name: validate the skillmgr config
  description: >-
    Check that every skillmgr.yaml parses and satisfies its rules. Fetches
    nothing, so the hook stays fast and works offline; run `skillmgr validate`
    without --config-only to also check the skills the sources yield.
  entry: skillmgr validate --config-only
  language: rust
  files: (^|/)skillmgr\.ya?ml$
