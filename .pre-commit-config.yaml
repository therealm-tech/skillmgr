# The test suite is deliberately absent: it runs in the `quality` workflow,
# not on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules are printed and then ignored without this.
        args:
          - --strict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check --
        language: system
        types:
          - rust

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types:
          - rust

      - id: skillmgr-validate
        name: validate the example skillmgr config
        entry: cargo run --quiet -- validate --config-only
        language: system
        files: ^examples/skillmgr\.yaml$

      - id: skillmgr-schema
        name: regenerate the config JSON Schema
        entry: scripts/generate-schema.sh
        language: system
        pass_filenames: false
        files: ^(src/config\.rs|src/schema\.rs|schema/skillmgr\.schema\.json)$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell
